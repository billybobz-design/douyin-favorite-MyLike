name: macOS community

on:
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing macos-v<version> tag to build and create a draft release (empty = build only)"
        type: string
        default: ""
      sign_mac:
        description: "Sign and notarize Mac builds using repository secrets"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-community-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  macos:
    if: github.repository == 'billybobz-design/douyin-favorite-MyLike'
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            app_dir: mac-arm64
          - os: macos-15-intel
            arch: x64
            app_dir: mac
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Validate architecture and release version
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            if (process.arch !== process.env.TARGET_ARCH) throw Error("Runner architecture mismatch");
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            const tag = process.env.RELEASE_TAG;
            if (tag && tag !== `macos-v${version}`) throw Error("Release tag must be macos-v followed by package.json version");
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm exec electron --version
      - run: pnpm format:check
      - run: pnpm test --maxWorkers=2
      - name: Build ad-hoc signed test packages
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.sign_mac }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:mac --${{ matrix.arch }}
      - name: Build Developer ID signed and notarized packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_mac }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${CSC_LINK:?Missing MAC_CSC_LINK}"
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          pnpm package:mac:signed --${{ matrix.arch }}
          codesign --verify --deep --strict "dist/${{ matrix.app_dir }}/MyLike.app"
          spctl --assess --type execute --verbose "dist/${{ matrix.app_dir }}/MyLike.app"
      - name: Test packaged application
        env:
          MYLIKE_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/${{ matrix.app_dir }}/MyLike.app/Contents/MacOS/MyLike
        run: pnpm test:e2e
      - name: Create checksums
        run: shasum -a 256 dist/*.dmg dist/*.zip | sed 's|  dist/|  |' > "dist/SHA256SUMS-mac-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: MyLike-macOS-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/SHA256SUMS-mac-${{ matrix.arch }}.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MyLike-macOS-test-results-${{ matrix.arch }}
          path: apps/desktop/test-results
          if-no-files-found: ignore

  draft-mac-release:
    name: Prepare community release draft
    needs: macos
    if: >-
      github.repository == 'billybobz-design/douyin-favorite-MyLike' &&
      github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MyLike-macOS-arm64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: MyLike-macOS-x64
          path: release
      - name: Verify downloaded packages
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS-mac-arm64.txt
          sha256sum -c SHA256SUMS-mac-x64.txt
      - name: Create or attach packages to a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "This version is already published. Use a new version tag."
              exit 1
            fi
          else
            cat > release-notes.md <<'NOTES'
          MyLike macOS 社区预览版。开发、测试、发布和问题反馈均由本 Fork 维护。

          - Apple Silicon 请选择 arm64，Intel 请选择 x64。
          - 请核对本次签名及 Apple 公证状态；普通构建仅使用临时签名。
          - 自动化测试不代表真实账号流程已完成人工验收。发布前请补充验收结果。
          - 问题反馈：https://github.com/billybobz-design/douyin-favorite-MyLike/issues
          NOTES
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "MyLike ${RELEASE_TAG#macos-v} · macOS 社区预览版" \
              --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip release/SHA256SUMS-mac-*.txt
