appId: io.mylike.desktop
productName: MyLike
directories:
  output: dist
files:
  - out/**
  - '!out/legal/**'
  - assets/icon.png
extraResources:
  - from: out/legal
    to: legal
asar: true
npmRebuild: false
win:
  icon: assets/icon.ico
  target: nsis
  signExecutable: false
nsis:
  oneClick: false
  installerLanguages: [zh_CN]
  uninstallerSidebar: build/installerSidebar.bmp
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  deleteAppDataOnUninstall: false
  artifactName: MyLike-${version}-win-${arch}-setup.exe

mac:
  icon: assets/icon.icns
  category: public.app-category.entertainment
  target:
    - dmg
    - zip
  artifactName: MyLike-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  notarize: true
dmg:
  artifactName: MyLike-${version}-mac-${arch}.${ext}
